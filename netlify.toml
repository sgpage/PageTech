# Netlify configuration for PageTech

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Force HTTPS redirect
[[redirects]]
  from = "http://pagetech.co.uk/*"
  to = "https://pagetech.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pagetech.co.uk/*"
  to = "https://www.pagetech.co.uk/:splat"
  status = 301
  force = true

# Redirect rules for clean URLs (optional)
[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/manual"
  to = "/manual.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
  from = "/report-fault"
  to = "/reportfault.html"
  status = 200
